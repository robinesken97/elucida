name: Build UVVisTool

on:
  push:
    tags: ["v*"]          # git tag v1.0.0 && git push --tags  -> Release mit allen drei Apps
  workflow_dispatch:      # oder manuell unter "Actions" starten

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-14,       label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }     # Intel-Macs (ab macOS 14)
          - { os: ubuntu-22.04,   label: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt-Bibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Abhängigkeiten
        # --prefer-binary: fertige Pakete statt Quellcode-Builds (z. B. PyMuPDF 2.0 ohne Intel-Mac-Wheel;
        # sonst versucht pip minutenlang zu kompilieren und fällt dann doch auf die Vorversion zurück)
        run: pip install --prefer-binary -r requirements.txt pyinstaller

      - name: Selbsttest aus dem Quellcode
        env: { QT_QPA_PLATFORM: offscreen }
        run: python uvvis_gui.py --selftest selftest_src --selftest-isnet

      - name: App bauen
        run: python build.py

      - name: Selbsttest der fertigen App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\UVVisTool\UVVisTool.exe" `
               -ArgumentList "--selftest","selftest_app","--selftest-isnet" -Wait -PassThru
          Get-Content selftest_app\selftest_report.txt
          exit $p.ExitCode

      - name: Selbsttest der fertigen App (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/UVVisTool.app/Contents/MacOS/UVVisTool --selftest selftest_app --selftest-isnet
          cat selftest_app/selftest_report.txt

      - name: Selbsttest der fertigen App (Linux)
        if: runner.os == 'Linux'
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          dist/UVVisTool/UVVisTool --selftest selftest_app --selftest-isnet
          cat selftest_app/selftest_report.txt

      - name: Packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\UVVisTool -DestinationPath UVVisTool-${{ matrix.label }}.zip

      - name: Packen (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/UVVisTool.app UVVisTool-${{ matrix.label }}.zip

      - name: Packen (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf UVVisTool-${{ matrix.label }}.tar.gz UVVisTool

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # feste Versionen + Prüfsummen (appimagetool 1.9.1, statische type2-Runtime ohne libfuse2)
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -sSL -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64" | sha256sum -c
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp -a dist/UVVisTool AppDir/usr/bin/
          python -c "from PIL import Image; Image.open('assets/icon.png').resize((256, 256), Image.LANCZOS).save('AppDir/UVVisTool.png')"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=UVVisTool' \
            'Comment=UV-Vis analysis of dilution series' 'Exec=UVVisTool' 'Icon=UVVisTool' \
            'Categories=Science;Chemistry;' 'Terminal=false' > AppDir/UVVisTool.desktop
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/UVVisTool/UVVisTool" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --runtime-file runtime-x86_64 \
            AppDir UVVisTool-${{ matrix.label }}.AppImage

      - name: Selbsttest des AppImage (Linux)
        if: runner.os == 'Linux'
        env: { QT_QPA_PLATFORM: offscreen, APPIMAGE_EXTRACT_AND_RUN: "1" }
        run: |
          ./UVVisTool-${{ matrix.label }}.AppImage --selftest selftest_appimage --selftest-isnet
          cat selftest_appimage/selftest_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UVVisTool-${{ matrix.label }}
          path: UVVisTool-${{ matrix.label }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.label }}
          path: selftest_*/selftest_report.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: UVVisTool-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: UVVisTool-*
