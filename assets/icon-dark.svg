<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
  </defs>

  <!-- Dunkles Squircle -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgDark)" stroke="#334155" stroke-width="8" />

  <!-- Zwei flache Bindungen -->
  <path d="M 280,660 L 512,340 L 744,660" fill="none" stroke="#475569" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 3 flache Atome (CPK für Dark Mode angepasst) -->
  <!-- Zentralatom (Hellgrau/Weiß für maximalen Kontrast auf Schwarz) -->
  <circle cx="512" cy="340" r="110" fill="#F8FAFC" />
  <!-- Links (Sauerstoff / Rot) -->
  <circle cx="280" cy="660" r="95" fill="#EF4444" />
  <!-- Rechts (Stickstoff / Blau) -->
  <circle cx="744" cy="660" r="95" fill="#3B82F6" />
</svg>
